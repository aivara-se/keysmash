<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Keysmash</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="play">
    <main id="screen" aria-label="Keysmash"></main>
    <button id="fullscreen" type="button" aria-label="Full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 9V4h5" />
        <path d="M15 4h5v5" />
        <path d="M20 15v5h-5" />
        <path d="M9 20H4v-5" />
      </svg>
    </button>
  </section>

  <section id="parent" hidden>
    <h1>Parent</h1>
    <fieldset>
      <legend>Word lists</legend>
      <div id="lists"></div>
    </fieldset>
    <p>Hold the left and right Shift keys for three seconds to reach this screen.</p>
    <button id="close" type="button">Close</button>
  </section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
