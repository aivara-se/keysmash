name: validate

on:
  pull_request:
  merge_group:

jobs:
  validate-agents:
    uses: aivara-se/.github/.github/workflows/validate-agents.yml@main

  validate-docs:
    uses: aivara-se/.github/.github/workflows/validate-docs.yml@main

  validate-config:
    uses: aivara-se/.github/.github/workflows/validate-config.yml@main
    secrets:
      ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Format
        run: bun fmt --no-script --check .
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
